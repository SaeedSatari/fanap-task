server:
  port: 8080

spring:
  application:
    name: network
  datasource:
    url: jdbc:h2:file:./data/network;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

network:
  ping:
    timeout: 3s
    max-attempts: 3
    retry-backoff: 1s
    max-retry-backoff: 30s
    lease-margin: 5s
  worker:
    threads: 4
    queue-capacity: 100
  recovery:
    enabled: true
    sweep-interval-ms: 1000
    requeue-running-on-startup: true
    dispatch-batch-size: 50
  monitoring:
    enabled: true
    interval-ms: 30000
  clients:
    retries: 1
    ping:
      base-url: ""
      connect-timeout: 1s
      read-timeout: 3s
    monitor:
      base-url: ""
      connect-timeout: 1s
      read-timeout: 3s
  mock:
    reachable-probability: 0.85
    min-latency-ms: 20
    max-latency-ms: 250
    transient-error-probability: 0.05
