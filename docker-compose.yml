services:
  netmon:
    build: .
    image: netmon:local
    ports:
      - "8080:8080"
    volumes:
      - netmon-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v1/devices?size=1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # docker compose --profile test run --rm smoke
  # از همان ایمیج برنامه استفاده می‌کند (bash و curl دارد)، پس چیزی دانلود نمی‌شود.
  smoke:
    profiles: ["test"]
    image: netmon:local
    depends_on:
      netmon:
        condition: service_healthy
    volumes:
      - ./smoke-test.sh:/smoke-test.sh:ro
    entrypoint: ["bash", "/smoke-test.sh", "http://netmon:8080"]

volumes:
  netmon-data: